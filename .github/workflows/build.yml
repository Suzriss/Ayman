name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'CY-store-main/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    defaults:
      run:
        working-directory: CY-store-main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch dependencies (Zsign + IDeviceKitten)
        run: |
          rm -rf Zsign IDeviceKitten

          # ملاحظة: نستخدم كوميت محدد من فرع package بدل آخر تحديث،
          # لأن آخر تحديث غيّر اسم المنتج (Zsign بدل ZsignSwift) وتوقيع
          # دالة sign()، مما يكسر التوافق مع كود Feather. هذا الكوميت هو
          # نفسه الذي يستخدمه مشروع Feather الأصلي كـ submodule مثبت.
          git init -q Zsign
          git -C Zsign remote add origin https://github.com/khcrysalis/Zsign-Package
          git -C Zsign fetch --depth 1 origin 6ffe703df73ef9069adacdbb19d571f11a69a801
          git -C Zsign checkout -q FETCH_HEAD

          git clone --depth 1 https://github.com/khcrysalis/IDeviceKit IDeviceKitten

      - name: Ensure license files exist
        run: |
          [ -f Zsign/LICENSE_LC ] || echo "License placeholder" > Zsign/LICENSE_LC

      - name: Select latest Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app

      - name: Build unsigned IPA
        run: make

      - name: Rename IPA
        run: |
          mkdir -p out
          cp packages/SYSTORE.ipa "out/CY-Store-unsigned.ipa"
          ls -lh out/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CY-Store-unsigned-ipa
          path: CY-store-main/out/CY-Store-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
