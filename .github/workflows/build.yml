name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'CY-store-main/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    defaults:
      run:
        working-directory: CY-store-main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch dependencies (Zsign + IDeviceKitten)
        run: |
          rm -rf Zsign IDeviceKitten
          git clone --depth 1 --branch package https://github.com/khcrysalis/Zsign-Package Zsign
          git clone --depth 1 https://github.com/khcrysalis/IDeviceKit IDeviceKitten

      - name: DEBUG - Show Zsign Package.swift
        run: |
          echo "========== Zsign/Package.swift =========="
          cat Zsign/Package.swift || echo "لا يوجد Package.swift!"
          echo ""
          echo "========== محتويات Zsign =========="
          ls -la Zsign
          echo ""
          echo "========== أسماء المنتجات (products) =========="
          grep -A2 -i "products\|\.library\|name:" Zsign/Package.swift | head -30

      - name: Ensure license files exist
        run: |
          [ -f Zsign/LICENSE_LC ] || echo "License placeholder" > Zsign/LICENSE_LC

      - name: Select latest Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app

      - name: Build unsigned IPA
        run: make

      - name: Rename IPA
        run: |
          mkdir -p out
          cp packages/SYSTORE.ipa "out/CY-Store-unsigned.ipa"
          ls -lh out/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CY-Store-unsigned-ipa
          path: CY-store-main/out/CY-Store-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
